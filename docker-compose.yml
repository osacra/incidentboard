services:
  postgres:
    image: postgres:17-alpine
    container_name: incidentboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentboard
      POSTGRES_USER: incidentboard
      POSTGRES_PASSWORD: incidentboard_dev
    ports:
      - "5432:5432"
    volumes:
      - incidentboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentboard -d incidentboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  incidentboard-postgres-data:
